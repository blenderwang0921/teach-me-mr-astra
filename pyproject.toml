[project]
name = "teach-me-mr-astra"
version = "0.1.0"
description = "A local, evidence-based C++ learning lab"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1", "ninja==1.13.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]


[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = ["evidence", "reports", "build", ".cache", ".venv", "learner", ".instructor", "exercises"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
