name: Lab verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            compiler: clang++-18
          - python: '3.14'
            compiler: g++-14
    env:
      CXX: ${{ matrix.compiler }}
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 g++-14
          python -m pip install uv==0.8.22
      - name: Install locked Python dependencies
        run: uv sync --frozen --python "$(command -v python)"
      - name: Check environment and initialize empty state if needed
        run: |
          .venv/bin/python tools/lab.py doctor
          .venv/bin/python tools/lab.py init
      - name: Verify tools and real C++ learning loop
        env:
          LAB_CPP_TESTS: '1'
        run: .venv/bin/python -m unittest discover -s tools/tests -v
      - name: Validate published and completed exercises
        run: .venv/bin/python tools/lab.py ci
